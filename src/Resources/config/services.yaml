
services:
    _defaults:
        autoconfigure: true
        autowire: true
        public: true


    Pbdkn\Efgco4\EventListener\DisableDebugModeForInternalTemplatesListener: ~
    
    Pbdkn\Efgco4\:
        resource: ../../
        exclude: ../../{DependencyInjection,Resources,Model}

        
    Pbdkn\Efgco4\Controller\Ajax\EfgRequestClass:
        tags:
            - { name: controller.service_arguments }
        public: true
                      